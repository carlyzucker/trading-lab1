<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b6964"><meta name="mobile-web-app-capable" content="yes"><title>Trading Strategy Lab</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap"><style>/* Layout: eine Spalte, oben Statusleiste, unten feste Tab-Leiste (Daumenbereich). Instrumenten-Konsole, kein Marketing. */
:root {
  --bg: #edf1f0;
  --surface: #fbfcfc;
  --surface-2: #f2f6f5;
  --ink: #132322;
  --muted: #566866;
  --line: #d3dcda;
  --accent: #0b6964;
  --accent-ink: #ffffff;
  --long: #1b7446;
  --short: #b2352d;
  --warn: #9a6200;
  --warn-bg: #fbf1dc;
  --bad-bg: #f8e3e1;
  --info-bg: #e2eeec;
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #0d1514;
    --surface: #141f1e;
    --surface-2: #1a2827;
    --ink: #e1ebe9;
    --muted: #93a6a3;
    --line: #283836;
    --accent: #52b6ae;
    --accent-ink: #062120;
    --long: #4dc68c;
    --short: #f07b70;
    --warn: #e2a948;
    --warn-bg: #2d2412;
    --bad-bg: #321b19;
    --info-bg: #15302d;
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #0d1514;
  --surface: #141f1e;
  --surface-2: #1a2827;
  --ink: #e1ebe9;
  --muted: #93a6a3;
  --line: #283836;
  --accent: #52b6ae;
  --accent-ink: #062120;
  --long: #4dc68c;
  --short: #f07b70;
  --warn: #e2a948;
  --warn-bg: #2d2412;
  --bad-bg: #321b19;
  --info-bg: #15302d;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font-family: var(--sans); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.07em; margin: 0; color: var(--muted); font-weight: 600; text-wrap: balance; }
h3 { font-size: 0.95rem; margin: 0.8rem 0 0.3rem; }
p { margin: 0.4rem 0; }
.num, .big-num, td.num, .top-eq { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.fine { color: var(--muted); font-size: 0.8rem; }
.center { text-align: center; }
.r { text-align: right; }
.pos { color: var(--long); }
.neg { color: var(--short); }
span.pos, span.neg { white-space: nowrap; }

.app { min-height: 100%; padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
.loading { padding: 40px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); color: var(--muted); }

body::before { content: ''; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.title { font-weight: 700; letter-spacing: -0.01em; }
.sub { font-size: 0.72rem; color: var(--muted); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); flex: none; }
.dot.on { background: var(--long); box-shadow: 0 0 0 4px color-mix(in srgb, var(--long) 22%, transparent); }
.dot.paused { background: var(--warn); }
.top-right { display: flex; align-items: center; gap: 8px; }
.top-eq { font-size: 0.85rem; font-weight: 600; }
.icon-btn { background: none; border: 1px solid transparent; border-radius: 8px; padding: 6px; cursor: pointer; display: grid; place-items: center; color: var(--muted); }
.icon-btn.on { color: var(--accent); border-color: var(--line); }

main { padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 760px; margin: 0 auto; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.lead { color: var(--muted); margin: 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.card-warn { background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
.card-bad { background: var(--bad-bg); }
.card-info { background: var(--info-bg); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }

.badge { display: inline-flex; align-items: center; font-size: 0.7rem; font-weight: 600; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; letter-spacing: 0.02em; vertical-align: middle; }
.badge-long { color: var(--long); border-color: color-mix(in srgb, var(--long) 45%, transparent); }
.badge-short { color: var(--short); border-color: color-mix(in srgb, var(--short) 45%, transparent); }
.badge-ok { color: var(--long); background: color-mix(in srgb, var(--long) 10%, transparent); border-color: transparent; }
.badge-bad { color: var(--short); background: color-mix(in srgb, var(--short) 10%, transparent); border-color: transparent; }
.badge-warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); border-color: transparent; }
.badge-accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }

.btn { appearance: none; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 9px 14px; font-weight: 600; cursor: pointer; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.small { padding: 5px 10px; min-height: 32px; font-size: 0.85rem; }
.btn.big { min-height: 48px; font-size: 1rem; padding-inline: 20px; }
.btn.stop { background: var(--short); border-color: var(--short); color: #fff; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn:focus-visible, .chip:focus-visible, .tabs button:focus-visible, .icon-btn:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.link { background: none; border: none; color: var(--accent); text-decoration: underline; padding: 0; cursor: pointer; }

.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.push { margin-left: auto; }
.bot-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.bot-row .btn.big { flex: 1 1 160px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 14px; margin: 8px 0; }
.kv { display: flex; flex-direction: column; min-width: 0; }
.kv .k { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.kv .v { overflow-wrap: anywhere; }
.hint { background: var(--warn-bg); color: var(--ink); border-radius: 8px; padding: 8px 10px; font-size: 0.88rem; }
.errors { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 6px; }
.errors p, .error-line { color: var(--short); font-size: 0.88rem; overflow-wrap: anywhere; }
.empty { color: var(--muted); margin: 4px 0; }
.gap { border-top: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); padding-top: 8px; margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }

.acc { display: flex; flex-direction: column; gap: 6px; }
.acc.compact { border-top: 1px solid var(--line); padding-top: 10px; }
.acc.compact:first-child { border-top: none; padding-top: 0; }
.acc-list { display: flex; flex-direction: column; gap: 10px; }
.acc-name { font-weight: 600; }
.acc-figs { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.big-num { font-size: 1.35rem; font-weight: 600; letter-spacing: -0.01em; }

.spark { width: 100%; height: 64px; display: block; }
.spark-base { stroke: var(--line); stroke-dasharray: 3 3; stroke-width: 1; }
.spark-up { stroke: var(--long); stroke-width: 1.8; vector-effect: non-scaling-stroke; }
.spark-down { stroke: var(--short); stroke-width: 1.8; vector-effect: non-scaling-stroke; }
.spark-fill-up { fill: color-mix(in srgb, var(--long) 10%, transparent); }
.spark-fill-down { fill: color-mix(in srgb, var(--short) 10%, transparent); }
.spark-dot-up { fill: var(--long); }
.spark-dot-down { fill: var(--short); }
.spark-empty { color: var(--muted); font-size: 0.8rem; padding: 10px 0; }

.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; }
table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
th { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 4px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
td:last-child { white-space: normal; }
tr:last-child td { border-bottom: none; }

.quote { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 6px; }
.src { display: block; font-size: 0.68rem; color: var(--muted); overflow-wrap: anywhere; }
.cands { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.cand { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.cand.active { border-color: var(--accent); }
details { margin-top: 8px; }
summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 0.88rem; padding: 4px 0; }
.probe { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; overflow-wrap: anywhere; }
.sources { font-size: 0.82rem; border-top: 1px solid var(--line); padding-top: 6px; margin-top: 6px; }

.form { display: grid; gap: 6px; margin: 6px 0 10px; }
.form label, .param label { font-size: 0.85rem; font-weight: 600; }
input[type='number'], input[type='url'], select, textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); min-height: 42px; }
textarea { font-family: var(--mono); font-size: 0.75rem; }
input[type='range'] { width: 100%; accent-color: var(--accent); }
fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px 8px; margin: 0; }
legend { font-size: 0.8rem; color: var(--muted); padding: 0 4px; }
.check { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-weight: 400 !important; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.params { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 4px; }
.param { display: grid; grid-template-columns: 1fr 120px; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.param input[type='checkbox'] { width: 22px; height: 22px; justify-self: end; accent-color: var(--accent); }
.assumptions { margin: 0; padding-left: 18px; font-size: 0.85rem; color: var(--muted); }
.history { padding-left: 18px; font-size: 0.8rem; }
.history code { display: block; font-family: var(--mono); font-size: 0.7rem; color: var(--muted); overflow-wrap: anywhere; }

.toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.85rem; padding: 4px 0; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.toggle .track { width: 40px; height: 24px; border-radius: 12px; background: var(--line); position: relative; transition: background 0.15s; flex: none; }
.toggle .thumb { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25); transition: transform 0.15s; }
.toggle input:checked + .track { background: var(--accent); }
.toggle input:checked + .track .thumb { transform: translateX(16px); }
.toggle input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; white-space: nowrap; cursor: pointer; font-size: 0.85rem; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.position { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; }
.position:first-of-type { border-top: none; margin-top: 0; padding-top: 0; }
.position.pending { font-size: 0.85rem; }
.journal { list-style: none; padding: 0; margin: 0; font-size: 0.82rem; display: flex; flex-direction: column; gap: 5px; }
.journal li { overflow-wrap: anywhere; border-left: 3px solid var(--line); padding-left: 8px; }
.journal .j-trade { border-left-color: var(--accent); }
.journal .j-warn { border-left-color: var(--warn); }
.consensus { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; }
.consensus:first-of-type { border-top: none; margin-top: 0; padding-top: 0; }

.busy { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 57px); z-index: 4; background: var(--info-bg); color: var(--ink); font-size: 0.85rem; padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: 0.88rem; z-index: 20; max-width: calc(100% - 32px); }

.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  display: grid; grid-template-columns: repeat(6, 1fr);
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(4px, env(safe-area-inset-left, 0px)); padding-right: max(4px, env(safe-area-inset-right, 0px));
}
.tabs button { background: none; border: none; padding: 12px 2px 14px; font-size: 0.78rem; font-weight: 600; color: var(--muted); cursor: pointer; position: relative; min-height: 54px; }
.tabs button.on { color: var(--accent); }
.tabs button.on::before { content: ''; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
.pnl { white-space: nowrap; }
.acc-figs > div:first-child { min-width: 0; }
.acc-figs > .r { flex: none; }
